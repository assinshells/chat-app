server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 — вбудований DNS докера в користувацьких bridge-мережах.
    # Без resolver + змінної nginx резолвить "backend" ОДИН раз при
    # старті і кешує IP назавжди. Якщо backend-контейнер перестворюється
    # (наприклад, після падіння через гонку з postgres на старті) — він
    # отримує новий IP, а nginx продовжує стукатися в старий і віддає
    # 502, поки сам не перезапуститься. Змінна в proxy_pass змушує
    # nginx резолвити хост через resolver при кожному запиті.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Віддаємо зібраний React-застосунок; fallback на index.html для клієнтського роутингу
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксуємо REST API запити до backend-сервісу
    location /api/auth/ {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
    }

    # Проксуємо WebSocket-трафік (Socket.IO) до backend-сервісу
    location /socket.io/ {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кешування статичних ресурсів
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}